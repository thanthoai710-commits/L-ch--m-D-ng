name: Build APK thu tu file zip
on:
  workflow_dispatch:
defaults:
  run:
    working-directory: lich-van-nien
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giai nen
        working-directory: .
        run: unzip -q lich-van-nien-chplay.zip
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: (yes | sdkmanager --licenses > /dev/null || true) && sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm install
      - run: npx cap add android
      - run: npm run icons
      - name: Icon thong bao va quyen
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp resources/ic_stat_lvn.png android/app/src/main/res/drawable/ic_stat_lvn.png
          grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml || \
            sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: grep -E "targetSdkVersion|compileSdkVersion" android/variables.gradle
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lich-van-nien-apk-thu
          path: lich-van-nien/android/app/build/outputs/apk/debug/app-debug.apk
